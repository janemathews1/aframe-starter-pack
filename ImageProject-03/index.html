<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="sea" src="Assets/UnderTheSea.jpg">
        <a-asset-item id="Shark" src="Assets/greatwhite.obj"></a-asset-item>
         <a-asset-item id="Submarine" src="Assets/Submarine.obj"></a-asset-item>
      </a-assets>

      <a-sky src="#sea"></a-sky>
       

      <a-obj-model src="#Shark" position="-5 3 -20" scale=".1 .1 .1" material="color: blue"></a-obj-model>
      <a-obj-model src="#Submarine" position="0 1.5 15" scale="1000 1000 1000" material="color: gray"></a-obj-model>
    </a-scene>
  </body>
</html>
